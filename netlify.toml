# Netlify settings for the Tarlac Gospel of Grace Church website.
# The site is plain HTML: there is nothing to build, Netlify just publishes this folder.

[build]
  publish = "."
  command = ""

# Let browsers keep the big, rarely-changing files so repeat visits load fast
# and use less of the free monthly allowance.
[[headers]]
  for = "/kjv.json"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/kjv.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
