<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarlac Gospel of Grace Church</title>
<link rel="icon" href="logo.png">
<meta name="description" content="Tarlac Gospel of Grace Church: preachings, announcements, events and the King James Bible.">
<meta property="og:title" content="Tarlac Gospel of Grace Church">
<meta property="og:description" content="Preachings, announcements, events and the King James Bible. “…to testify the gospel of the grace of God.” Acts 20:24">
<meta property="og:image" content="photos/fellowship.jpg">
<meta name="theme-color" content="#142a5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a chapel-blue band carries the church's name, a live countdown to the next service and the week's KJV verse;
   below it, a calm stone page of bulletin-style lists (dated blocks, scripture first) with the King James Bible one tap away. */
:root {
  --paper: #f1f2f5;
  --surface: #ffffff;
  --ink: #1a2233;
  --muted: #5a6273;
  --line: #dde0e8;
  --deep: #142a5c;
  --deep-2: #1f3f85;
  --deep-ink: #eef0f6;
  --gold: #e7cf95;
  --accent: #8a6a2f;
  --accent-soft: #f3ecdf;
  --on-accent: #ffffff;
  --ok: #2f6b45;
  --warn: #9a5a12;
  --danger: #a33a32;
  --hl: #fff1c7;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 12px;
  --scale: 1;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  --shadow-up: 0 2px 4px rgba(20,30,50,.08), 0 16px 40px rgba(20,30,50,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1420; --surface: #171e2d; --ink: #e7e9f0; --muted: #9aa3b6; --line: #2a3347;
    --deep: #0a1430; --deep-2: #142450; --deep-ink: #e7e9f0; --accent: #d6b06a; --accent-soft: #2a2416; --on-accent: #1a1408;
    --ok: #7cc495; --warn: #e3a557; --danger: #ee8a80; --hl: #3a3117;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-up: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1420; --surface: #171e2d; --ink: #e7e9f0; --muted: #9aa3b6; --line: #2a3347;
  --deep: #0a1430; --deep-2: #142450; --deep-ink: #e7e9f0; --accent: #d6b06a; --accent-soft: #2a2416; --on-accent: #1a1408;
  --ok: #7cc495; --warn: #e3a557; --danger: #ee8a80; --hl: #3a3117;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-up: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.55; }
body.has-player { padding-bottom: 84px; }
img { max-width: 100%; display: block; }
a { color: var(--accent); }
button { font-family: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.4rem, 6vw, 3.9rem); }
h2 { font-size: clamp(1.8rem, 4vw, 2.3rem); }
h3 { font-size: 1.45rem; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }
.narrow { width: min(740px, 100% - 32px); margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
.top { background: var(--deep); color: var(--deep-ink); position: sticky; top: 0; z-index: 30; border-bottom: 1px solid rgba(255,255,255,.08); }
.top .bar { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; flex: 1 1 auto; }
.brand img { width: 52px; height: auto; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.brand img.custom { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
footer .flogo { width: 92px; margin-bottom: 10px; }
.brand-mark { width: 42px; height: 42px; flex: none; }
.brand b { font-family: var(--display); font-size: 1.45rem; font-weight: 700; line-height: 1.05; }
.brand small { display: block; font-family: var(--body); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.tools { display: flex; gap: 6px; align-items: center; flex: none; }
.tool { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--deep-ink); height: 38px; min-width: 38px; padding: 0 10px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .9rem; font-weight: 600; }
.tool:hover { background: rgba(255,255,255,.16); }
.tool kbd { font: 600 .7rem var(--body); opacity: .7; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 4px; }
.tool svg { width: 18px; height: 18px; }
.menu-btn { display: none; }
nav.main { display: flex; gap: 2px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
nav.main a { color: var(--deep-ink); opacity: .8; text-decoration: none; padding: 7px 13px; border-radius: 999px; font-size: .95rem; font-weight: 500; white-space: nowrap; transition: background .15s, opacity .15s; }
nav.main a:hover { opacity: 1; background: rgba(255,255,255,.08); }
nav.main a[aria-current="page"] { opacity: 1; background: var(--gold); color: var(--deep); font-weight: 700; }
nav.main a.admin-link { color: var(--gold); }
nav.main a.admin-link[aria-current="page"] { color: var(--deep); }
@media (max-width: 900px) {
  .menu-btn { display: inline-flex; }
  .tool .lbl, .tool kbd { display: none; }
  nav.main { display: none; flex-direction: column; padding: 4px 0 14px; }
  body.nav-open nav.main { display: flex; }
  nav.main a { padding: 12px 14px; font-size: 1.05rem; border-radius: 10px; }
  .brand b { font-size: 1.2rem; }
}
.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); z-index: 40; width: 0; transition: width .1s linear; }

/* Ribbon */
.ribbon { background: var(--accent-soft); color: var(--ink); font-size: .95rem; }
.ribbon .wrap { padding: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Hero */
.hero { background: var(--deep); color: var(--deep-ink); position: relative; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1.35fr 1fr; gap: 40px; padding: 76px 0 92px; position: relative; z-index: 1; }
.slides { position: absolute; inset: 0; z-index: 0; }
.slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; }
.slide.on { opacity: 1; animation: kb 9s ease-out both; }
@keyframes kb { from { transform: scale(1.12); } to { transform: scale(1.02); } }
.hero::after { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(90deg, rgba(8,20,50,.94) 0%, rgba(8,20,50,.74) 48%, rgba(8,20,50,.38) 100%), linear-gradient(0deg, rgba(8,20,50,.9), transparent 42%); pointer-events: none; }
.hero h1 { text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.slide-ui { position: absolute; z-index: 2; right: max(16px, calc((100% - 1160px) / 2)); bottom: 20px; display: flex; gap: 12px; align-items: center; color: #fff; font-size: .85rem; }
.slide-ui #slide-cap { opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.dots { display: flex; gap: 6px; align-items: center; }
.dots button { width: 10px; height: 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,.5); cursor: pointer; padding: 0; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { background: var(--gold); width: 28px; }
.slide-pause { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.3); color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.slide-pause svg { width: 14px; height: 14px; }
@media (max-width: 600px) { .slide-ui #slide-cap { display: none; } }

/* Photo banners */
.banner { position: relative; color: var(--deep-ink); background-color: var(--deep); background-image: linear-gradient(90deg, rgba(8,20,50,.94) 0%, rgba(8,20,50,.78) 50%, rgba(8,20,50,.45) 100%), var(--img); background-size: cover; background-position: var(--pos, center); }
.banner > .wrap, .banner > .narrow { padding: 60px 0 50px; display: grid; gap: 12px; position: relative; }
.banner .eyebrow { color: var(--gold); }
.banner h1 { text-shadow: 0 2px 20px rgba(0,0,0,.3); }
.banner p.lead { color: rgba(238,240,246,.9); font-size: 1.15rem; max-width: 62ch; }
.banner .stat { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: rgba(238,240,246,.85); backdrop-filter: blur(4px); }
.banner .stat b { color: #fff; }
.banner .meta { color: rgba(238,240,246,.85); }
.banner .scripture { color: var(--gold); }
.banner .back { color: var(--gold); margin-top: 0; }

/* Theme verse band */
.theme { background: radial-gradient(900px 400px at 15% 50%, var(--deep-2), var(--deep)); color: var(--deep-ink); overflow: hidden; }
.theme .wrap { display: grid; grid-template-columns: 280px 1fr; gap: 52px; align-items: center; padding: 60px 0; }
.theme img { width: 100%; max-width: 280px; filter: drop-shadow(0 14px 34px rgba(0,0,0,.45)); }
.theme blockquote { margin: 10px 0 0; font-family: var(--read); font-size: clamp(1.25rem, 2.3vw, 1.65rem); line-height: 1.55; }
.theme blockquote mark { background: none; color: var(--gold); font-style: italic; font-weight: 600; }
@media (max-width: 760px) { .theme .wrap { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 24px; padding: 44px 0; } .theme img { max-width: 190px; } .theme .actions { justify-content: center; } }

/* Notifications & sharing */
.tool { position: relative; }
.tool .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 999px; background: #e5484d; color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--deep); }
.tool.ring svg { animation: ring 1.1s ease 2; transform-origin: 50% 10%; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 35% { transform: rotate(-13deg); } 55% { transform: rotate(9deg); } 75% { transform: rotate(-5deg); } }
nav.main a .ndot { display: inline-grid; place-items: center; min-width: 19px; height: 19px; border-radius: 999px; background: #e5484d; color: #fff; font-size: .7rem; font-weight: 700; margin-left: 6px; padding: 0 5px; vertical-align: 1px; }
.notice-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.notice-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; color: var(--ink); font: inherit; transition: border-color .15s, transform .15s; }
.notice-list button:hover { border-color: var(--accent); transform: translateX(2px); }
.notice-list button.seen { opacity: .7; }
.notice-list .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.notice-list .ic svg { width: 22px; height: 22px; }
.ic.preaching { background: var(--deep-2); } .ic.announcement { background: var(--accent); } .ic.event { background: var(--ok); }
.notice-list b { display: block; font-size: 1rem; }
.notice-list small { color: var(--muted); font-size: .85rem; }
.unread-dot { width: 10px; height: 10px; border-radius: 50%; background: #e5484d; }
.notice-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 10px; flex-wrap: wrap; }
.popcard { position: fixed; left: 18px; bottom: 18px; z-index: 44; width: min(390px, calc(100% - 36px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-up); overflow: hidden; animation: slidein .5s cubic-bezier(.2,.8,.2,1); }
.popcard[hidden] { display: none; }
@keyframes slidein { from { transform: translateY(30px); } }
.popcard .pc-top { background: linear-gradient(135deg, var(--deep), var(--deep-2)); color: #fff; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.popcard .pc-top img { width: 42px; flex: none; }
.popcard .pc-top b { font-family: var(--display); font-size: 1.35rem; line-height: 1.1; display: block; }
.popcard .pc-top small { color: var(--gold); font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.popcard .pc-x { margin-left: auto; background: rgba(255,255,255,.12); border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; flex: none; }
.popcard .pc-body { padding: 14px 16px 16px; display: grid; gap: 10px; }
.popcard ul { margin: 0; padding-left: 18px; color: var(--muted); }
body.has-player .popcard { bottom: 100px; }
.qr-box { display: grid; grid-template-columns: 260px 1fr; gap: 26px; align-items: center; }
.qr-box > img { width: 100%; border-radius: 16px; border: 1px solid var(--line); background: #fff; }
@media (max-width: 640px) { .qr-box { grid-template-columns: 1fr; justify-items: center; text-align: center; } .qr-box > img { max-width: 240px; } .qr-box .actions { justify-content: center; } }
.url-field { display: flex; gap: 8px; } .url-field input { font-size: .9rem; } .url-field .btn { white-space: nowrap; flex: none; }
footer .fqr { width: 132px; border-radius: 12px; background: #fff; padding: 6px; cursor: zoom-in; border: 0; display: block; }
footer .fqr img { width: 100%; }
.share-card-prev { width: 100%; max-width: 220px; border-radius: 12px; box-shadow: var(--shadow); }

/* Key verse: 2 Timothy 2:15 */
.keyverse { position: relative; color: #fff; text-align: center; background-image: linear-gradient(180deg, rgba(8,20,50,.86), rgba(8,20,50,.8)), url('photos/worship-team.jpg'); background-size: cover; background-position: center 35%; overflow: hidden; }
.keyverse .narrow { padding: 84px 0 80px; display: grid; gap: 18px; justify-items: center; width: min(920px, 100% - 32px); }
.keyverse .ref-badge { display: inline-flex; gap: 10px; align-items: center; border: 1px solid rgba(231,207,149,.5); color: var(--gold); border-radius: 999px; padding: 6px 16px; font-weight: 700; letter-spacing: .12em; font-size: .78rem; text-transform: uppercase; background: rgba(8,20,50,.4); }
.keyverse blockquote { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.9rem, 4.4vw, 3.3rem); line-height: 1.18; text-wrap: balance; text-shadow: 0 2px 24px rgba(0,0,0,.4); }
.keyverse blockquote .q { color: var(--gold); font-size: 1.3em; line-height: 0; vertical-align: -.25em; }
.keyverse blockquote mark { background: linear-gradient(transparent 62%, rgba(231,207,149,.38) 62%); color: #fff2cf; font-style: italic; padding: 0 .08em; }
.keyverse cite { font-style: normal; font-family: var(--read); font-size: 1.15rem; color: rgba(255,255,255,.85); letter-spacing: .04em; }
.keyverse .rule { width: 64px; height: 2px; background: var(--gold); border-radius: 2px; }

/* Photo mosaic */
.mosaic { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 210px; gap: 12px; }
.mosaic .ph { position: relative; overflow: hidden; border-radius: 14px; border: 0; padding: 0; cursor: zoom-in; background: var(--line); box-shadow: var(--shadow); }
.mosaic .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.mosaic .ph:hover img, .mosaic .ph:focus-visible img { transform: scale(1.07); }
.mosaic .ph span { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; color: #fff; text-align: left; font-family: var(--display); font-size: 1.35rem; font-weight: 600; background: linear-gradient(transparent, rgba(8,20,50,.85)); }
.mosaic .big { grid-column: span 2; grid-row: span 2; }
.mosaic .big span { font-size: 1.8rem; }
.mosaic .wide { grid-column: span 2; }
@media (max-width: 760px) { .mosaic { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; } .mosaic .big { grid-row: span 2; } }

/* Visit card */
.ev-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .ev-grid { grid-template-columns: 1fr; } }
.visit { border-radius: var(--r); padding: 26px; color: #fff; display: grid; gap: 10px; background-image: linear-gradient(180deg, rgba(8,20,50,.55), rgba(8,20,50,.94)), var(--img); background-size: cover; background-position: center 30%; min-height: 320px; align-content: end; box-shadow: var(--shadow-up); }
.visit h3 { font-size: 1.9rem; }
.visit ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.visit li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.15); padding: 6px 0; }
.visit li span:last-child { color: var(--gold); font-variant-numeric: tabular-nums; }

/* Preaching photo thumbs */
.pc { padding: 0; overflow: hidden; }
.pc .thumb { height: 150px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 14px 18px; }
.pc .thumb span { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: #f4ead2; text-shadow: 0 1px 10px rgba(0,0,0,.5); }
.pc .inner { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.about-img { border-radius: var(--r); width: 100%; object-fit: cover; }
.logo-meaning { display: grid; grid-template-columns: 200px 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .logo-meaning { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .2; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.hero .eyebrow { color: var(--gold); }
.hero p.tag { font-size: 1.2rem; opacity: .9; margin-top: 14px; max-width: 42ch; }
.hero .actions { margin-top: 26px; }
.verse { border-left: 3px solid var(--gold); padding: 4px 0 4px 18px; margin-top: 28px; max-width: 50ch; }
.verse q { font-family: var(--read); font-style: italic; font-size: 1.15rem; quotes: "\201C" "\201D"; }
.verse .cite { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: .9rem; color: var(--gold); letter-spacing: .03em; flex-wrap: wrap; }
.verse .cite button { background: none; border: 0; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; padding: 0; }
.panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13); border-radius: 16px; padding: 22px; align-self: start; backdrop-filter: blur(4px); }
.countdown { display: grid; gap: 6px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
.countdown .what { font-size: .9rem; opacity: .85; }
.cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cd div { background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px 0; text-align: center; }
.cd b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
.cd span { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; opacity: .75; }
.live-now { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--gold); font-size: 1.2rem; }
.live-now::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #ff6b5b; box-shadow: 0 0 0 0 rgba(255,107,91,.6); animation: pulse 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(255,107,91,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,91,0); } }
.panel h3 { font-size: 1.3rem; margin-bottom: 8px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; }
.panel li { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.panel li:last-child { border-bottom: 0; }
.panel li span:last-child { font-variant-numeric: tabular-nums; color: var(--gold); text-align: right; }
.panel .addr { margin-top: 12px; font-size: .95rem; opacity: .85; }
@media (max-width: 860px) { .hero .wrap { grid-template-columns: 1fr; padding: 36px 0 40px; gap: 28px; } }

/* Sections */
main { padding-bottom: 72px; min-height: 60vh; }
main.enter > * { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
main.enter > *:nth-child(2) { animation-delay: .05s; } main.enter > *:nth-child(3) { animation-delay: .1s; }
@keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
section.block { padding: 44px 0 8px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .15em; font-weight: 700; color: var(--accent); }
.page-head { padding: 40px 0 8px; display: grid; gap: 10px; }
.page-head p.lead { color: var(--muted); font-size: 1.12rem; max-width: 62ch; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.more-link { font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.more-link:hover { text-decoration: underline; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 .95rem var(--body); padding: 10px 18px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; text-decoration: none; background: var(--accent); color: var(--on-accent); transition: transform .15s, box-shadow .15s, background .15s; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.light { background: #f4ead2; color: #1d2b4a; }
.btn.outline-light { background: transparent; color: var(--deep-ink); border-color: rgba(255,255,255,.35); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 6px 13px; font-size: .86rem; }
.btn:disabled { opacity: .55; cursor: progress; transform: none; }
.btn svg { width: 16px; height: 16px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.link-btn { background: none; border: 0; color: var(--accent); font: 600 .9rem var(--body); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.link-btn:hover { background: var(--accent-soft); }
.link-btn.danger { color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .86rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s, border-color .18s; }
.card.hover:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { color: var(--accent); }
.card h3 a::after { content: ""; position: absolute; inset: 0; }
.card.hover { position: relative; }
.card .admin-row, .card .play-btn, .card .ref-link, .card .chips { position: relative; z-index: 1; }
.meta { color: var(--muted); font-size: .92rem; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.scripture { font-family: var(--read); color: var(--accent); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); letter-spacing: .02em; border: 1px solid transparent; }
button.chip { cursor: pointer; font-family: var(--body); }
button.chip:hover { border-color: var(--accent); }
.chip.draft { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.chip.urgent { background: var(--danger); color: #fff; }
.chip.pin { background: var(--deep); color: var(--gold); }
.chip.soon { background: transparent; border-color: var(--ok); color: var(--ok); }
.chip.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.admin-row { display: flex; gap: 4px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.summary { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ref-link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.ref-link:hover { text-decoration-style: solid; }
.play-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--deep); color: var(--gold); border: 0; border-radius: 999px; padding: 5px 12px 5px 8px; font: 700 .8rem var(--body); cursor: pointer; }
.play-btn svg { width: 16px; height: 16px; }
.play-btn:hover { filter: brightness(1.15); }

.feature { display: grid; grid-template-columns: 1.1fr 1fr; padding: 0; overflow: hidden; gap: 0; }
.feature .cover { background: linear-gradient(135deg, var(--deep), var(--deep-2)); min-height: 260px; background-size: cover; background-position: center; position: relative; }
.feature .cover .ref { position: absolute; left: 22px; right: 22px; bottom: 18px; font-family: var(--display); font-size: 2.1rem; color: #f4ead2; font-weight: 600; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
.feature .cover .kjv-snip { position: absolute; left: 22px; right: 22px; top: 22px; color: #f4ead2; font-family: var(--read); font-style: italic; opacity: .85; font-size: 1rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.feature .txt { padding: 26px; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 760px) { .feature { grid-template-columns: 1fr; } }

/* Rows */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 78px 1fr auto; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); align-items: start; transition: background .15s; position: relative; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.row:last-child { border-bottom: 0; }
.datebox { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; font-variant-numeric: tabular-nums; background: var(--surface); }
.datebox .m { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
.datebox .d { font-family: var(--display); font-size: 1.95rem; font-weight: 700; line-height: 1; }
.datebox .w { font-size: .72rem; color: var(--muted); }
.row h3 { font-size: 1.3rem; }
.row h3 a { color: var(--ink); text-decoration: none; }
.row h3 a:hover { color: var(--accent); }
.row .body { margin-top: 6px; }
.row .side { display: flex; flex-direction: column; gap: 4px; align-items: end; }
@media (max-width: 600px) { .row { grid-template-columns: 62px 1fr; } .row .side { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; flex-wrap: wrap; } }

.ann { border-left: 4px solid var(--accent); }
.ann.is-urgent { border-left-color: var(--danger); }
.ann img { border-radius: 8px; max-height: 320px; object-fit: cover; width: 100%; cursor: zoom-in; }
.ann .more { display: none; }
.ann.open .more { display: block; }
.ann .clip { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ann.open .clip { display: block; -webkit-line-clamp: unset; }

/* Archive */
.filters { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 10px; margin: 18px 0 10px; }
@media (max-width: 900px) { .filters { grid-template-columns: 1fr 1fr; } .filters .q { grid-column: 1 / -1; } }
.searchbox { position: relative; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.searchbox input { padding-left: 38px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .92rem; color: var(--muted); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.shelf { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; }
.series { flex: 0 0 220px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: linear-gradient(160deg, var(--deep), var(--deep-2)); color: var(--deep-ink); border-radius: var(--r); padding: 16px; cursor: pointer; display: grid; gap: 6px; transition: transform .18s, box-shadow .18s; }
.series:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
.series b { font-family: var(--display); font-size: 1.35rem; line-height: 1.1; }
.series span { font-size: .82rem; color: var(--gold); font-weight: 600; }
.series[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
.active-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 4px; min-height: 30px; }
.year-head { font-family: var(--display); font-size: 1.6rem; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 12px; }
.year-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.year-head small { font-family: var(--body); font-size: .85rem; color: var(--muted); font-weight: 500; }

/* Forms */
input, select, textarea { width: 100%; font: 1rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea { resize: vertical; line-height: 1.5; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
.field { display: grid; gap: 6px; align-content: start; }
.field label { font-weight: 600; font-size: .92rem; }
.hint { color: var(--muted); font-size: .86rem; }
.form-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.check { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.current-file { display: flex; gap: 10px; align-items: center; font-size: .88rem; color: var(--muted); flex-wrap: wrap; }
.current-file img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
.kjv-preview { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-family: var(--read); font-size: .95rem; max-height: 160px; overflow: auto; }
.kjv-preview sup { color: var(--accent); font-weight: 700; margin-right: 3px; font-family: var(--body); }

/* Preaching reading */
.p-head { padding: 28px 0 12px; display: grid; gap: 12px; }
.p-head .scripture { font-size: 1.35rem; }
.cover-img { border-radius: var(--r); overflow: hidden; margin: 12px 0; }
.cover-img img { width: 100%; object-fit: cover; max-height: 420px; }
.media-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; gap: 12px; margin: 18px 0; flex-wrap: wrap; align-items: center; box-shadow: var(--shadow); }
.passage { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 18px 20px; margin: 20px 0; }
.passage .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.passage .vtext { font-family: var(--read); font-size: 1.08rem; line-height: 1.75; max-height: 260px; overflow: hidden; position: relative; }
.passage.open .vtext { max-height: none; }
.passage:not(.open) .vtext.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--surface)); }
.vtext sup { color: var(--accent); font-weight: 700; font-family: var(--body); font-size: .7em; margin-right: 3px; }
.prose { font-family: var(--read); font-size: 1.14rem; line-height: 1.78; }
.prose > * + * { margin-top: 1em; }
.prose h2 { font-size: 1.85rem; margin-top: 1.6em; }
.prose h3 { font-size: 1.45rem; margin-top: 1.4em; }
.prose blockquote { margin: 1.2em 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--accent); font-style: italic; color: var(--muted); }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .3em; }
.lead-sum { font-size: 1.22rem; color: var(--muted); font-family: var(--read); font-style: italic; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; }
.pager a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.pager a:hover { border-color: var(--accent); transform: translateY(-2px); }
.pager a small { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; }
.pager a.next { text-align: right; }
.back { display: inline-flex; gap: 6px; font-weight: 600; text-decoration: none; margin-top: 24px; }

/* Bible */
.bible-bar { position: sticky; top: var(--top-h, 64px); z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); padding: 10px 0; display: grid; grid-template-columns: 1.4fr .7fr auto 1.6fr; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
@media (max-width: 820px) { .bible-bar { grid-template-columns: 1fr 1fr; position: static; } .bible-bar .nav-ch { grid-column: 1 / -1; justify-content: space-between; } .bible-bar form { grid-column: 1 / -1; } }
.nav-ch { display: flex; gap: 6px; }
.chapter { font-family: var(--read); font-size: 1.16rem; line-height: 1.85; padding: 10px 0 30px; }
.chapter h2 { margin: 24px 0 14px; }
.vs { padding: 2px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; transition: background .2s; }
.vs:hover { background: color-mix(in srgb, var(--hl) 50%, transparent); }
.vs.sel { background: var(--hl); }
.vs.target { background: var(--hl); box-shadow: inset 3px 0 0 var(--accent); }
.vs sup { color: var(--accent); font-weight: 700; font-family: var(--body); font-size: .68em; margin-right: 4px; user-select: none; }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 35; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 8px 8px 18px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-up); max-width: calc(100% - 32px); }
body.has-player .selbar { bottom: 100px; }
.selbar button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: var(--paper); color: var(--ink); }
.selbar button.x { background: transparent; color: var(--paper); }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin: 14px 0 26px; }
.chgrid a { display: grid; place-items: center; height: 48px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: background .15s, transform .15s; }
.chgrid a:hover { background: var(--accent); color: var(--on-accent); transform: translateY(-2px); }
.testament { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 12px 0 28px; }
.testament a { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); font-weight: 500; transition: border-color .15s, transform .15s; }
.testament a:hover { border-color: var(--accent); transform: translateY(-2px); }
.results .res { padding: 12px 0; border-bottom: 1px solid var(--line); }
.results .res a { font-weight: 700; text-decoration: none; }
.results mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }

/* Gallery */
.album { margin-top: 28px; }
.album h3 { margin-bottom: 12px; display: flex; gap: 10px; align-items: baseline; }
.album h3 small { font-family: var(--body); font-size: .9rem; color: var(--muted); font-weight: 500; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.photo { position: relative; border-radius: 10px; overflow: hidden; background: var(--line); aspect-ratio: 4 / 3; border: 0; padding: 0; cursor: zoom-in; }
.photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.photo:hover img { transform: scale(1.05); }
.photo span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; color: #fff; font-size: .85rem; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.65)); }
.lightbox { position: relative; }
.lightbox img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; background: #000; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 1.5rem; cursor: pointer; }
.lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }

/* Admin */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.tile b { display: block; font-family: var(--display); font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .9rem; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 22px; }
.quick button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.quick button:hover { transform: translateY(-2px); border-color: var(--accent); }
.quick b { font-size: 1.02rem; }
.quick span { color: var(--muted); font-size: .86rem; }
.quick i { font-style: normal; font-size: 1.3rem; color: var(--accent); font-family: var(--display); font-weight: 700; }
.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
.meter div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .6s; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checklist li { display: flex; gap: 10px; align-items: center; }
.checklist .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: .75rem; }
.checklist .done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 30px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.skel { background: linear-gradient(90deg, var(--line), color-mix(in srgb, var(--line) 40%, var(--surface)), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--r); height: 140px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.note { background: var(--accent-soft); border-radius: var(--r); padding: 16px 18px; }

/* Footer */
footer { background: var(--deep); color: var(--deep-ink); padding: 44px 0 30px; font-size: .95rem; }
footer .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
footer h3 { font-size: 1.3rem; margin-bottom: 8px; }
footer a { color: var(--gold); }
footer p + p { margin-top: 4px; }
footer .small { opacity: .7; font-size: .85rem; }
footer .copy { grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,.1); padding-top: 16px; opacity: .65; font-size: .85rem; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(8, 12, 22, .6); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .18s ease; }
.modal[hidden] { display: none; }
@keyframes fade { from { background: rgba(8,12,22,0); } }
.modal-card { background: var(--surface); color: var(--ink); border-radius: 16px; width: min(760px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: pop .22s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { transform: translateY(12px) scale(.98); } }
.modal-card.wide { width: min(1000px, 100%); }
.modal-card.palette { width: min(640px, 100%); align-self: start; margin-top: 8vh; }
.modal-card header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.modal-card header h2 { font-size: 1.7rem; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.icon-btn { background: none; border: 1px solid var(--line); color: var(--ink); width: 38px; height: 38px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; line-height: 1; flex: none; }
.pal-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; max-height: 55vh; overflow: auto; }
.pal-list li button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--ink); display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; font-size: 1rem; }
.pal-list li button small { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.pal-list li button[aria-selected="true"] { background: var(--accent-soft); }
.pal-list li button span em { color: var(--muted); font-style: normal; font-size: .88rem; display: block; }

/* Player */
.player { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 45; background: var(--deep); color: var(--deep-ink); border-radius: 16px; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; box-shadow: 0 12px 40px rgba(0,0,0,.35); max-width: 980px; margin-inline: auto; }
.player[hidden] { display: none; }

    const tm = /(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/i.exec(b) || /(\d{1,2})(?::(\d{2}))\s*(am|pm)?/i.exec(a);
    if (!days.length || !tm) continue;
    let h = +tm[1]; const mi = +(tm[2] || 0); const ap = (tm[3] || "").toLowerCase();
    if (ap.startsWith("p") && h < 12) h += 12; if (ap.startsWith("a") && h === 12) h = 0;
    for (const d of days) for (let add = 0; add < 8; add++) {
      const t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + add, h, mi);
      if (t.getDay() !== d) continue;
      const end = new Date(t.getTime() + 2 * 3600e3);

}

      : `<h3>Choose a chapter</h3><div class="chgrid">${KJV[b].map((_, i) => `<a href="#bible-${b + 1}-${i + 1}">${i + 1}</a>`).join("")}</div>`;
    const top = b == null ? banner(P.worship, "center 30%", `<div class="eyebrow">Holy Bible · Authorized King James Version</div><h1>The Bible</h1><p class="lead">All 66 books of the King James Version. Choose a book, search any word, or type a reference like John 3:16.</p>`) + `<div class="wrap">` : `<div class="wrap">${head}`;

  </div>`;
}
function highlight(t, q) { const e = esc(t); const words = q.trim().split(/\s+/).filter(w => w.length > 1).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")); return words.length ? e.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>") : e; }
function bibleSearch(q) {
  q = q.trim(); if (!q || !KJV) return;
  const r = parseRef(q); if (r) { S.bibleResults = null; location.hash = bibleHash(r.b, r.c1, r.v1).slice(1); return; }
  const words = q.toLowerCase().split(/\s+/).filter(Boolean); const items = [];
  outer: for (let b = 0; b < 66; b++) for (let c = 0; c < KJV[b].length; c++) for (let v = 0; v < KJV[b][c].length; v++) {

  }
  S.bibleResults = { q, items }; render();
}

/* ---------- Hero light canvas ---------- */
let lightRaf = 0;
function drawLight() {
  const c = $("#light"); if (!c) return; cancelAnimationFrame(lightRaf);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = c.getContext("2d"); const dpr = Math.min(2, devicePixelRatio || 1);
  const size = () => { c.width = c.offsetWidth * dpr; c.height = c.offsetHeight * dpr; };
  size();
  const motes = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + .4, s: Math.random() * .00025 + .00008, a: Math.random() * .5 + .15 }));
  const frame = t => {
    if (!document.body.contains(c)) return;
    if (c.width !== c.offsetWidth * dpr) size();
    const w = c.width, h = c.height; ctx.clearRect(0, 0, w, h);
    const sway = reduce ? 0 : Math.sin(t / 4000) * .04;
    for (let i = 0; i < 4; i++) {
      const x0 = w * (.62 + i * .09 + sway), g = ctx.createLinearGradient(x0, 0, x0 - w * .25, h);
      g.addColorStop(0, "rgba(231,207,149,0.10)"); g.addColorStop(1, "rgba(231,207,149,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + w * .05, 0); ctx.lineTo(x0 - w * .18, h); ctx.lineTo(x0 - w * .32, h); ctx.closePath(); ctx.fill();
    }
    for (const m of motes) { if (!reduce) { m.y -= m.s * 16; if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); } } ctx.fillStyle = `rgba(244,234,210,${m.a})`; ctx.beginPath(); ctx.arc(m.x * w, m.y * h, m.r * dpr, 0, 7); ctx.fill(); }
    if (!reduce) lightRaf = requestAnimationFrame(frame);
  };
  lightRaf = requestAnimationFrame(frame);
}

function fileFld(id, label, accept, cur, kind, hint = "") {

async function shrinkImage(file, max = 1800) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file); const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 1.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}
async function uploadFrom(id, kind, cur) {
  const el = document.getElementById(id); const rm = document.getElementById(id + "-rm"); const file = el && el.files && el.files[0];
  if (file) {
    if (!S.assets) throw new Error("Uploads aren't available for your account.");
    const blob = kind === "image" ? await shrinkImage(file) : file;
    if (blob.size > 50 * 1024 * 1024) throw new Error(`“${file.name}” is larger than 50 MB. For long recordings, upload to YouTube or Facebook and paste the link instead.`);
    return (await S.assets.upload(blob)).id;
  }
  if (rm && rm.checked) return "";
  return cur || "";
}

    ${fld("s-status", "Visibility", sel("s-status", [["published", "Published for everyone"], ["draft", "Draft (only editors see it)"]], s.status))}
    ${fld("s-summary", "Short summary", ta("s-summary", s.summary, 3, 'maxlength="600"'), "One to three sentences shown in the archive.", true)}
    ${fld("s-body", "Preaching notes or full manuscript", ta("s-body", s.body, 14), mdHint, true)}
    ${fld("s-video", "Video link (YouTube or Facebook)", inp("s-video", s.videoUrl, "url", 'placeholder="https://…"'), "", true)}
    ${fileFld("s-audio", "Audio recording", "audio/*", s.audioId, "audio", "MP3 or M4A, up to 50 MB (about 1 hour at standard quality).")}
    ${fileFld("s-pdf", "Notes PDF", "application/pdf", s.pdfId, "pdf")}
    ${fileFld("s-cover", "Cover image", "image/*", s.coverId, "image")}
    ${fld("s-tags", "Topics", inp("s-tags", (s.tags || []).join(", "), "text", 'placeholder="faith, grace, family"'), "Separate with commas.")}
  </div>${formFoot(id ? "Save changes" : "Save preaching")}</form>`, { wide: true });
  wirePreview("s-book", "s-passage", "s-prev");
  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {
    const nid = id || newId();
    if (val("s-video") && !safeUrl(val("s-video"))) throw new Error("The video link should start with https://");
    const data = {
      title: val("s-title"), date: val("s-date"), preacher: val("s-preacher"), book: val("s-book"), passage: val("s-passage"),
      series: val("s-series"), status: val("s-status"), summary: val("s-summary"), body: $("#s-body").value,
      videoUrl: safeUrl(val("s-video")), tags: val("s-tags").split(",").map(t => t.trim()).filter(Boolean).slice(0, 12),
      audioId: await uploadFrom("s-audio", "audio", s.audioId), pdfId: await uploadFrom("s-pdf", "pdf", s.pdfId), coverId: await uploadFrom("s-cover", "image", s.coverId),
      createdAt: s.createdAt || Date.now(), updatedAt: Date.now()
    };
    data.publishedAt = data.status === "published" ? (s.status === "published" && id ? (s.publishedAt || s.createdAt || Date.now()) : Date.now()) : null;
    await writeDoc("sermons", nid, data); closeModal(); toast(id ? "Preaching updated." : "Preaching saved."); if (!id) location.hash = "preaching-" + nid;
  }); };
}
function annForm(id) {

  openModal(id ? "Edit announcement" : "Post an announcement", `<form id="ed-form"><div class="form-grid">

    ${fld("a-link", "Link (optional)", inp("a-link", a.link, "url", 'placeholder="https://…"'))}

  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {

  }); };
}
function eventForm(id) {
  const ev = S.events.find(x => x.id === id) || { date: today(), category: "Fellowship" };
  openModal(id ? "Edit event" : "Add an event", `<form id="ed-form"><div class="form-grid">
    ${fld("e-title", "Event name *", inp("e-title", ev.title, "text", 'required maxlength="140"'), "", true)}
    ${fld("e-date", "Date *", inp("e-date", ev.date, "date", "required"))}
    ${fld("e-enddate", "Ends on (multi-day events)", inp("e-enddate", ev.endDate, "date"))}
    ${fld("e-start", "Starts at", inp("e-start", ev.start, "time"))}
    ${fld("e-end", "Ends at", inp("e-end", ev.end, "time"))}
    ${fld("e-loc", "Location", inp("e-loc", ev.location, "text", 'maxlength="140"'))}
    ${fld("e-cat", "Category", sel("e-cat", EVENT_CATS, ev.category))}
    ${fld("e-desc", "Details", ta("e-desc", ev.description, 5), "", true)}
  </div>${formFoot(id ? "Save changes" : "Add event")}</form>`);
  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {
    const data = { title: val("e-title"), date: val("e-date"), endDate: val("e-enddate"), start: val("e-start"), end: val("e-end"), location: val("e-loc"), category: val("e-cat"), description: $("#e-desc").value, createdAt: ev.createdAt || Date.now(), updatedAt: Date.now() };
    if (data.endDate && data.endDate < data.date) throw new Error("The end date is before the start date.");
    await writeDoc("events", id || newId(), data); closeModal(); toast(id ? "Event updated." : "Event added.");
  }); };
}
function photosForm() {
  const albums = [...new Set(S.gallery.map(g => g.album).filter(Boolean))];
  openModal("Upload photos", `<form id="ed-form"><div class="form-grid">
    ${fld("g-album", "Album", inp("g-album", "", "text", 'list="album-list" required maxlength="80" placeholder="e.g. Youth Camp 2026"') + `<datalist id="album-list">${albums.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`)}
    ${fld("g-date", "Date taken", inp("g-date", today(), "date"))}
    ${fld("g-files", "Photos *", `<input id="g-files" type="file" accept="image/*" multiple required>`, "Pick several at once. Large photos are resized automatically.", true)}
    ${fld("g-cap", "Caption for these photos (optional)", inp("g-cap", "", "text", 'maxlength="140"'), "", true)}
  </div><p class="hint" id="g-progress"></p>${formFoot("Upload")}</form>`);
  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {
    if (!S.assets) throw new Error("Uploads aren't available for your account.");
    const files = [...$("#g-files").files]; if (!files.length) throw new Error("Choose at least one photo.");
    let n = 0;
    for (const f of files) {
      $("#g-progress").textContent = `Uploading ${n + 1} of ${files.length}…`;
      const blob = await shrinkImage(f);
      if (blob.size > 50 * 1024 * 1024) { toast(`Skipped “${f.name}”: larger than 50 MB.`, true); continue; }
      const r = await S.assets.upload(blob);
      await writeDoc("gallery", newId(), { imageId: r.id, album: val("g-album"), date: val("g-date"), caption: val("g-cap"), createdAt: Date.now() });
      n++;
    }
    closeModal(); toast(`${plural(n, "photo")} uploaded.`);
  }); };
}
function settingsForm() {
  const s = cfg();
  openModal("Church details", `<form id="ed-form"><div class="form-grid">
    ${fld("c-pastor", "Pastor's name", inp("c-pastor", s.pastorName, "text", 'maxlength="80" placeholder="Ptr. Juan Dela Cruz"'))}
    ${fld("c-tag", "Tagline", inp("c-tag", s.tagline, "text", 'maxlength="160"'), "A one-line welcome under the church name.")}
    ${fld("c-times", "Service times", ta("c-times", s.serviceTimes, 4, 'placeholder="Sunday Worship Service | 9:00 AM\nWednesday Prayer Meeting | 7:00 PM"'), "One per line: name | time. Include the day name so the home page can count down to the next service.", true)}
    ${fld("c-addr", "Address", ta("c-addr", s.address, 2), "", true)}
    ${fld("c-map", "Google Maps link", inp("c-map", s.mapUrl, "url", 'placeholder="https://maps.app.goo.gl/…"'))}
    ${fld("c-phone", "Phone", inp("c-phone", s.phone, "tel"))}
    ${fld("c-email", "Email", inp("c-email", s.email, "email"))}
    ${fld("c-fb", "Facebook page", inp("c-fb", s.facebook, "url", 'placeholder="https://facebook.com/…"'))}
    ${fld("c-yt", "YouTube channel", inp("c-yt", s.youtube, "url"))}
    ${fld("c-live", "Livestream link", inp("c-live", s.liveUrl, "url"), "Shows a “Watch live” button on the home page.")}
    ${fld("c-about", "Our story & mission", ta("c-about", s.about, 6), mdHint, true)}
    ${fld("c-bio", "About the pastor", ta("c-bio", s.pastorBio, 5), "", true)}
    ${fld("c-beliefs", "What we believe", ta("c-beliefs", s.beliefs, 6), "", true)}
    ${fld("c-mins", "Ministries", ta("c-mins", s.ministries, 4, 'placeholder="Youth Ministry | Fridays, 6 PM\nChildren\'s Church | During Sunday service"'), "One per line: name | short description", true)}
    ${fld("c-give", "Giving details", ta("c-give", s.givingInfo, 5, 'placeholder="GCash: 0917 000 0000 (Church Name)\nBank: …"'), "Account numbers get a Copy button automatically.", true)}
    ${fileFld("c-logo", "Church logo", "image/*", s.logoId, "image")}
    ${fileFld("c-pphoto", "Pastor's photo", "image/*", s.pastorPhotoId, "image")}
    ${fileFld("c-hero", "Home page background photo", "image/*", s.heroImageId, "image", "Added as the first photo of the home page slideshow. A wide photo works best.")}
  </div>${formFoot("Save details")}</form>`, { wide: true });
  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {
    const data = { ...s, churchName: CHURCH, pastorName: val("c-pastor"), tagline: val("c-tag"), serviceTimes: $("#c-times").value,
      address: val("c-addr"), mapUrl: safeUrl(val("c-map")), phone: val("c-phone"), email: val("c-email"), facebook: safeUrl(val("c-fb")), youtube: safeUrl(val("c-yt")), liveUrl: safeUrl(val("c-live")),
      about: $("#c-about").value, pastorBio: $("#c-bio").value, beliefs: $("#c-beliefs").value, ministries: $("#c-mins").value, givingInfo: $("#c-give").value,
      logoId: await uploadFrom("c-logo", "image", s.logoId), pastorPhotoId: await uploadFrom("c-pphoto", "image", s.pastorPhotoId), heroImageId: await uploadFrom("c-hero", "image", s.heroImageId), updatedAt: Date.now() };
    await S.db.doc("site/settings").set(data); closeModal(); toast("Church details saved.");
  }); };
}
function verseForm() {
  const s = cfg();
  openModal("Verse of the week", `<form id="ed-form"><div class="form-grid">
    ${fld("v-ref", "Bible reference", inp("v-ref", s.verseRef, "text", 'placeholder="e.g. Joshua 1:9" required'), "The King James text fills in on its own. You can still edit it.", true)}
    ${fld("v-text", "Verse text (KJV)", ta("v-text", s.verseText, 4, "required"), "", true)}
  </div>${formFoot("Save verse")}</form>`);
  let t; $("#v-ref").addEventListener("input", () => { clearTimeout(t); t = setTimeout(async () => {
    const r = parseRef(val("v-ref")); if (!r) return; try { await loadKJV(); } catch { return; }
    const vs = getPassage(r); if (vs.length && vs.length <= 8) $("#v-text").value = vs.map(x => x.t).join(" ");
  }, 300); });
  $("#ed-form").onsubmit = e => { e.preventDefault(); saving($("#save-btn"), async () => {
    const r = parseRef(val("v-ref"));
    await S.db.doc("site/settings").set({ ...s, churchName: CHURCH, verseText: val("v-text"), verseRef: r ? refLabel(r) : val("v-ref"), updatedAt: Date.now() }); closeModal(); toast("Verse of the week updated.");
  }); };
}

/* ---------- Actions ---------- */
async function delDoc(col, id, what) {
  if (!(await confirmBox(`Delete ${what}? This can't be undone.`))) return;
  try { await S.db.collection(col).doc(id).delete(); toast("Deleted."); if (col === "sermons" && route() === "preaching-" + id) location.hash = "preachings"; } catch (e) { toast(errMsg(e), true); }
}
const NEEDS_DB = new Set(["new-preaching", "edit-preaching", "del-preaching", "new-ann", "edit-ann", "del-ann", "new-event", "edit-event", "del-event", "add-photos", "del-photo", "edit-settings", "edit-verse"]);
document.addEventListener("click", async e => {
  if (e.target.closest("[data-close]") || e.target.id === "modal") { closeModal(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (NEEDS_DB.has(act) && !S.db) { toast("Still connecting. Try again in a moment.", true); return; }
  switch (act) {
    case "new-preaching": return preachingForm();
    case "edit-preaching": return preachingForm(id);
    case "del-preaching": { const s = S.sermons.find(x => x.id === id); return delDoc("sermons", id, `the preaching “${s ? s.title : ""}”`); }
    case "new-ann": return annForm();
    case "edit-ann": return annForm(id);
    case "del-ann": return delDoc("announcements", id, "this announcement");
    case "new-event": return eventForm();
    case "edit-event": return eventForm(id);
    case "del-event": return delDoc("events", id, "this event");
    case "add-photos": return photosForm();
    case "open-photo": return photoView(id);
    case "lb": return lbStep(+id);
    case "zoom-img": return openModal("Image", `<div class="lightbox"><img src="${esc(b.dataset.src)}" alt=""></div>`, { wide: true });
    case "del-photo": closeModal(); return delDoc("gallery", id, "this photo");
    case "edit-settings": return settingsForm();
    case "edit-verse": return verseForm();
    case "ann-cat": S.annCat = id || ""; return render();
    case "toggle-ann": S.openAnn.has(id) ? S.openAnn.delete(id) : S.openAnn.add(id); return render();
    case "filter-series": S.f = { ...S.f, series: S.f.series === id && route() === "preachings" ? "" : id }; if (route() !== "preachings") location.hash = "preachings"; else render(); return;
    case "clear-one": S.f[id] = ""; return render();
    case "clear-filters": S.f = { q: "", book: "", series: "", year: "", sort: S.f.sort }; return render();
    case "view": S.view = id; store.set("view", id); return renderResults();
    case "ref": return showRef(b.dataset.ref);
    case "copy-passage": { await loadKJV().catch(() => {}); const r = parseRef(b.dataset.ref); const vs = getPassage(r); if (vs.length) copyText(`${vs.map(x => x.t).join(" ")}\n— ${refLabel(r)} (KJV)`); return; }
    case "toggle-passage": { const p = $("#passage"); if (p) { p.classList.add("open"); b.remove(); } return; }
    case "copy": return copyText(id);
    case "play": return playPreaching(id);
    case "slide": return setSlide(+id);
    case "slide-pause": S.slidePaused = !S.slidePaused; b.innerHTML = S.slidePaused ? ICON.play : ICON.pause; b.setAttribute("aria-label", S.slidePaused ? "Play slideshow" : "Pause slideshow"); return;
    case "palette": return openPalette();
    case "share": e.preventDefault(); return openShare();
    case "login": e.preventDefault(); return openLogin();
    case "forgot": return forgotPassword();
    case "logout": try { await TGGC_BACKEND.signOut(); } catch {} location.hash = "home"; location.reload(); return;
    case "dl": return downloadFile(id, b.dataset.name);
    case "notes": { const pc = document.getElementById("popcard"); if (pc) pc.hidden = true; return openNotes(); }
    case "notes-read": markAllRead(); closeModal(); render(); return toast("All caught up.");
    case "note-go": { markRead([b.dataset.key]); const pc = document.getElementById("popcard"); if (pc) pc.hidden = true; if (!$("#modal").hidden) closeModal(); if (location.hash.slice(1) === id) render(); else location.hash = id; return; }
    case "pop-close": { const pc = document.getElementById("popcard"); if (pc) pc.hidden = true; return; }
    case "pal-go": return palGo(id);
    case "menu": document.body.classList.toggle("nav-open"); b.setAttribute("aria-expanded", document.body.classList.contains("nav-open")); return;
    case "font-up": case "font-down": { const sc = Math.round(Math.min(1.3, Math.max(.9, store.get("scale", 1) + (act === "font-up" ? .1 : -.1))) * 10) / 10; store.set("scale", sc); applyPrefs(); renderTop(route()); return; }
    case "theme": { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("theme", t); renderTop(route()); return; }
    case "verse": { const n = +id; S.bibleSel.has(n) ? S.bibleSel.delete(n) : S.bibleSel.add(n); return render(); }
    case "clear-verses": S.bibleSel.clear(); return render();
    case "copy-verses": { const [, bb, cc] = route().split("-"); const b0 = +bb - 1, c0 = +cc; const ns = [...S.bibleSel].sort((x, y) => x - y); const txt = ns.map(n => `${n} ${KJV[b0][c0 - 1][n - 1]}`).join("\n"); const range = ns.length > 1 && ns[ns.length - 1] - ns[0] === ns.length - 1 ? `${ns[0]}-${ns[ns.length - 1]}` : ns.join(","); return copyText(`${txt}\n— ${BOOKS[b0]} ${c0}:${range} (KJV)`); }
    case "clear-bible-search": S.bibleResults = null; S.bibleQ = ""; return render();
    case "reload-kjv": S.lastRoute = null; return render();
  }
});
document.addEventListener("change", e => {
  const a = e.target.dataset && e.target.dataset.actChange;
  if (a === "bible-book") location.hash = `bible-${e.target.value}-1`;
  if (a === "bible-ch") { const b = route().split("-")[1]; location.hash = `bible-${b}-${e.target.value}`; }
  const k = e.target.dataset && e.target.dataset.filter; if (k) { S.f[k] = e.target.value; renderResults(); }
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.filter; if (k === "q") { S.f.q = e.target.value; renderResults(); } });
document.addEventListener("submit", e => { if (e.target.id === "bible-search") { e.preventDefault(); S.bibleQ = val("bb-q"); bibleSearch(S.bibleQ); } });
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (!$("#modal").hidden) {
    if (e.key === "Escape") closeModal();
    if (S.lb && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !typing) lbStep(e.key === "ArrowRight" ? 1 : -1);
    return;
  }
  if ((e.key === "/" && !typing) || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openPalette(); }
  if (route().startsWith("bible-") && !typing && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const a = $(e.key === "ArrowRight" ? ".nav-ch a[aria-label='Next chapter']" : ".nav-ch a[aria-label='Previous chapter']"); if (a) location.hash = a.getAttribute("href").slice(1); }
});
function onScroll() {
  const y = scrollY; $("#totop").hidden = y < 700;
  const p = $("#progress");
  if (route().startsWith("preaching-")) { const h = document.documentElement.scrollHeight - innerHeight; p.style.width = h > 0 ? Math.min(100, y / h * 100) + "%" : "0"; } else p.style.width = "0";
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px"));
$("#totop").onclick = () => scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => renderTop(route()));

boot();
</script>
